name: Question bank JSON validation

on:
  push:
    paths:
      - 'data/question-bank/**'
      - 'scripts/validate_question_bank.py'
      - 'scripts/question_bank_catalog.py'
      - 'supabase/functions/question-bank/**'
      - 'src/integrations/s2-04/**'
      - 'src/interview-engine/**'
      - 'tests/test_interview_session_orchestrator.mjs'
      - 'tests/test_s2_04_bridge.mjs'
      - 'scripts/generate_question_bank_seed_sql.py'
      - 'scripts/smoke_question_bank_http.mjs'
      - 'tests/test_question_bank.py'
      - 'tests/test_postgres_migrations_static.py'
      - 'db/postgres/**'
      - '.github/workflows/question-bank-validation.yml'
  pull_request:
    paths:
      - 'data/question-bank/**'
      - 'scripts/validate_question_bank.py'
      - 'scripts/question_bank_catalog.py'
      - 'supabase/functions/question-bank/**'
      - 'src/integrations/s2-04/**'
      - 'src/interview-engine/**'
      - 'tests/test_interview_session_orchestrator.mjs'
      - 'tests/test_s2_04_bridge.mjs'
      - 'scripts/generate_question_bank_seed_sql.py'
      - 'scripts/smoke_question_bank_http.mjs'
      - 'tests/test_question_bank.py'
      - 'tests/test_postgres_migrations_static.py'
      - 'db/postgres/**'
      - '.github/workflows/question-bank-validation.yml'
  workflow_dispatch:

jobs:
  validate-question-bank:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 120 question drafts and rubrics
        run: python scripts/validate_question_bank.py
      - name: Run question bank regression tests
        run: python -m unittest discover -s tests -v

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-secret
          POSTGRES_DB: question_bank_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d question_bank_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-secret
      PGDATABASE: question_bank_ci
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client exists
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Prepare test roles
        run: psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Apply reference schema on isolated test database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/migrations/0001_question_bank_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/migrations/0002_publication_guards.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/migrations/0003_question_bank_indexes.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/migrations/0004_private_catalog_boundary.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/migrations/0005_interview_session_snapshots.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/migrations/0006_complete_interview_session.sql
      - name: Test publication guards, audit and immutability
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/0001_publication_contract.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/0002_private_catalog_boundary.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/0003_published_projection_contract.sql
          psql -X -v ON_ERROR_STOP=1 -f db/postgres/tests/0004_interview_session_snapshots.sql
      - name: Generate and apply draft corpus seed
        run: |
          python scripts/generate_question_bank_seed_sql.py > /tmp/question_bank_seed.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/question_bank_seed.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/question_bank_seed.sql

  edge-function-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function TypeScript
        run: deno check supabase/functions/question-bank/index.ts
      - name: Test Edge Function authorization policy
        run: deno test supabase/functions/question-bank/policy_test.ts

  s2-04-adapter-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run S2-04 bridge adapter tests
        run: |
          node --test tests/test_s2_04_bridge.mjs tests/test_interview_session_orchestrator.mjs
          node --check scripts/smoke_question_bank_http.mjs
