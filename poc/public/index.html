<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Répétition — simulateur d’entretien IA (POC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F1; --surface:#FFFFFF; --ink:#17222B; --muted:#5A6670; --line:#D5DDD9; --mist:#E3E9E6;
  --sage:#2E6B64; --sage-ink:#FFFFFF; --sage-soft:#DCEBE7; --signal:#E3A33B; --plum:#8A4B6E; --plum-soft:#F1E3EA;
  --focus:#1F5BD8;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11181D; --surface:#182228; --ink:#E7EEEA; --muted:#9AA8A3; --line:#2A3740; --mist:#1F2B31;
    --sage:#6DB5AA; --sage-ink:#0E1A18; --sage-soft:#1D3431; --signal:#F0B455; --plum:#D29AB9; --plum-soft:#35232E; --focus:#8AB0FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11181D; --surface:#182228; --ink:#E7EEEA; --muted:#9AA8A3; --line:#2A3740; --mist:#1F2B31;
  --sage:#6DB5AA; --sage-ink:#0E1A18; --sage-soft:#1D3431; --signal:#F0B455; --plum:#D29AB9; --plum-soft:#35232E; --focus:#8AB0FF;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;letter-spacing:-0.02em;margin:0}
h1{font-size:clamp(2.5rem,5.8vw,4.3rem)}
h2{font-size:clamp(1.8rem,3.6vw,2.6rem)}
h3{font-size:1.25rem;letter-spacing:-0.01em;font-weight:600}
p{margin:0}
a{color:var(--sage)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.bar .wrap{display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-0.02em;background:none;border:0;padding:0;cursor:pointer}
.brand i{width:22px;height:22px;border-radius:50%;border:3px solid var(--sage);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--signal)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--mist)}
.nav button:hover{color:var(--ink)}
.poc-tag{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}

main.wrap{padding-top:clamp(32px,6vw,72px);padding-bottom:96px}
.lede{font-size:1.2rem;color:var(--muted);max-width:56ch}
.stack>*+*{margin-top:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;padding:12px 20px;cursor:pointer;font-weight:700;min-height:48px;transition:transform .12s ease}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sage);border-color:var(--sage);color:var(--sage-ink)}
.btn.quiet{border-color:var(--line);font-weight:400}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* home */
.home{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,5vw,72px);align-items:center}
.home h1{max-width:13ch}
.home .lede{margin:22px 0 34px}
.facts{margin-top:44px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;border-top:1px solid var(--line);padding-top:22px}
.facts b{display:block;font-family:var(--display);font-size:1.05rem}
.facts span{color:var(--muted);font-size:.95rem}

/* the interviewer orb — the one bold element */
.orb{position:relative;width:min(100%,380px);aspect-ratio:1;margin-inline:auto}
.orb svg{width:100%;height:100%;overflow:visible}
.orb .ring{fill:none;stroke:var(--sage);transform-origin:200px 200px;transition:stroke .4s}
.orb .core{fill:var(--sage);transform-origin:200px 200px}
.orb .spark{fill:var(--signal);transform-origin:200px 200px;opacity:0;transition:opacity .3s}
.orb.speaking .spark{opacity:1;animation:pulse 1.1s ease-in-out infinite}
.orb.speaking .ring{animation:ripple 2.4s ease-out infinite}
.orb.speaking .ring:nth-of-type(2){animation-delay:.3s}.orb.speaking .ring:nth-of-type(3){animation-delay:.6s}.orb.speaking .ring:nth-of-type(4){animation-delay:.9s}
.orb.listening .ring{stroke:var(--signal)}
.orb.listening .core{animation:breathe 2.6s ease-in-out infinite}
.orb.idle .core{animation:breathe 5s ease-in-out infinite}
.orb{margin-bottom:56px}
.orb .name{position:absolute;left:0;right:0;bottom:-56px;text-align:center;font-family:var(--display);font-weight:600}
.orb .name small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:.9rem}
@keyframes ripple{0%{transform:scale(1);opacity:.9}70%{opacity:.25}100%{transform:scale(1.18);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pulse{0%,100%{transform:scale(.85)}50%{transform:scale(1.15)}}

/* steps / forms */
.steps{display:flex;gap:6px;margin-bottom:28px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--sage)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,36px)}
.narrow{max-width:760px}
.q-label{font-family:var(--display);font-size:clamp(1.5rem,3vw,2rem);font-weight:600;line-height:1.15;letter-spacing:-0.015em;margin-bottom:6px}
.hint{color:var(--muted);font-size:.95rem}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:22px}
.choice{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer;min-height:56px;transition:border-color .15s}
.choice:hover{border-color:var(--muted)}
.choice[aria-pressed="true"],.choice[aria-checked="true"]{border-color:var(--sage);background:var(--sage-soft)}
.choice b{display:block}
.choice small{color:var(--muted)}
.check{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.check:last-of-type{border-bottom:0}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--sage);flex:none}
.check small{display:block;color:var(--muted)}
.nav-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:30px}
.nav-row .row{flex-wrap:nowrap}
.nav-row > .row:last-child{margin-left:auto}

/* prep */
.prep{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
.plan-list{list-style:none;padding:0;margin:16px 0 0;counter-reset:q}
.plan-list li{counter-increment:q;display:grid;grid-template-columns:34px 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.plan-list li::before{content:counter(q);font-family:var(--display);font-weight:800;color:var(--sage)}
.plan-list small{display:block;color:var(--muted)}
.pill{display:inline-block;font-size:.85rem;border-radius:99px;padding:2px 10px;background:var(--mist);color:var(--ink);margin:4px 4px 0 0}

/* interview */
.room{display:grid;grid-template-columns:minmax(260px,.9fr) 1.1fr;gap:clamp(20px,4vw,48px);align-items:start}
.room .orb{width:min(100%,300px)}
.qtext{font-family:var(--display);font-size:clamp(1.45rem,2.8vw,2.05rem);font-weight:600;line-height:1.18;letter-spacing:-0.015em;margin-top:28px}
.qtext.followup{color:var(--plum)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;margin-bottom:10px}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;background:var(--sage);transition:width .4s}
textarea{width:100%;min-height:210px;resize:vertical;border:1.5px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);line-height:1.55}
textarea:focus{border-color:var(--sage);outline:none;box-shadow:0 0 0 3px var(--sage-soft)}
.answer-tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem}
.live i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.live.on i{background:var(--signal);animation:pulse 1s infinite}
.cam{margin-top:22px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--mist);aspect-ratio:4/3;max-width:300px;position:relative}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.cam span{position:absolute;left:8px;bottom:8px;font-size:.8rem;background:color-mix(in srgb,var(--paper) 85%,transparent);padding:2px 8px;border-radius:6px}
.transcript{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.transcript summary{cursor:pointer;color:var(--muted)}
.transcript ol{padding-left:20px}
.transcript li{margin:10px 0}
.transcript .who{font-weight:700}
.paused{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);display:grid;place-items:center;padding:24px}

/* report */
.score-head{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,48px);align-items:center;margin-bottom:36px}
.dial{width:180px;height:180px;position:relative}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:3.2rem;font-weight:800;letter-spacing:-0.03em}
.dial b small{font-size:1rem;color:var(--muted);font-weight:400;display:block;text-align:center;margin-top:-10px}
.notice{border-left:4px solid var(--signal);background:var(--surface);padding:12px 16px;border-radius:0 12px 12px 0;color:var(--muted);font-size:.95rem}
.criteria{display:grid;gap:14px}
.crit{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.crit-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.bars{display:flex;gap:5px;margin:10px 0 12px}
.bars i{width:34px;height:8px;border-radius:4px;background:var(--line)}
.bars i.on{background:var(--sage)}
.crit.weak .bars i.on{background:var(--plum)}
.crit .lvl{font-family:var(--display);font-weight:800;font-size:1.3rem}
.evidence{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--mist);font-size:.95rem}
.evidence q{font-style:italic}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
.two ul{padding-left:20px;margin:10px 0 0}
.two li{margin:6px 0}

/* coaching */
.actions{display:grid;gap:14px;margin-top:24px}
.action{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.action .tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center}
.action.done .tick{background:var(--sage);border-color:var(--sage);color:var(--sage-ink)}
.action.done h3{text-decoration:line-through;color:var(--muted)}
.guide{margin-top:28px}
.guide details{border-top:1px solid var(--line);padding:14px 0}
.guide summary{cursor:pointer;font-weight:700}
.guide p,.guide ul{margin-top:8px;color:var(--muted)}

/* dashboard */
.dash-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-top:28px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:.9rem}
.table-wrap{overflow-x:auto}
.empty{text-align:center;padding:48px 20px}
.spark polyline{fill:none;stroke:var(--sage);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--sage)}
.cmp{display:grid;gap:12px;margin-top:12px}
.cmp div{display:grid;grid-template-columns:120px 1fr 32px;gap:10px;align-items:center;font-size:.95rem}
.cmp .track{height:8px;background:var(--line);border-radius:4px;position:relative}
.cmp .track i{position:absolute;inset:0 auto 0 0;background:var(--sage);border-radius:4px}

/* modal + toast */
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);max-width:520px;width:calc(100% - 32px);padding:28px}
dialog::backdrop{background:rgba(10,15,20,.45)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.processing{display:grid;justify-items:center;text-align:center;gap:20px;padding:40px 0}
.processing ol{list-style:none;padding:0;margin:0;text-align:left;display:grid;gap:8px}
.processing li{color:var(--muted)}
.processing li.ok{color:var(--ink)}
.processing li.ok::before{content:"✓ ";color:var(--sage);font-weight:700}

@media (max-width:860px){
  .home,.room,.prep,.two,.dash-grid,.score-head{grid-template-columns:1fr}
  .home .orb{order:-1;width:min(70%,260px)}
  .room .orb{width:180px;margin:0}
  .facts{grid-template-columns:1fr}
  .nav{gap:0}.nav button{padding:8px;font-size:.95rem}
  .bar .wrap{gap:8px}
  .nav-row .row{flex-wrap:wrap}
  .action{grid-template-columns:auto 1fr}
  .action .btn{grid-column:1/-1}
  .dial{width:140px;height:140px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v2 : comptes, coach */
.btn.sm{min-height:38px;padding:6px 14px;font-size:.95rem;border-radius:10px}
.btn.wide{width:100%}
.bar .wrap{gap:14px}
#account{display:flex;align-items:center;gap:8px}
.who-chip{display:flex;align-items:center;gap:8px;line-height:1.15;font-size:.92rem}
.who-chip i{width:30px;height:30px;border-radius:50%;background:var(--sage-soft);color:var(--sage);display:grid;place-items:center;font-style:normal;font-weight:700}
.who-chip small{display:block;color:var(--muted);font-size:.8rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.auth{display:grid;grid-template-columns:1fr minmax(320px,460px);gap:clamp(24px,6vw,80px);align-items:center}
.auth-side .orb{width:150px;margin:0 0 24px}
.auth-side h2{max-width:16ch}
.auth-side .lede{margin-top:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--mist);border-radius:12px;padding:4px;margin-bottom:22px}
.seg button{border:0;background:none;border-radius:9px;padding:10px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.role-pick{border:0;padding:0;margin:0 0 6px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-pick legend{font-weight:700;margin-bottom:8px}
.role-pick .choice{display:block}
.role-pick .choice input{position:absolute;opacity:0}
.role-pick .choice.on{border-color:var(--sage);background:var(--sage-soft)}
.role-pick .choice:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.field{display:block;margin:16px 0 0;border:0;padding:0}
.field>span,.field legend{display:block;font-weight:700;margin-bottom:6px}
.field small{display:block;color:var(--muted);font-size:.9rem;margin-top:6px}
.field input,.field select,.input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
.input{width:auto;flex:1;min-width:220px}
.field input:focus,.field select:focus,.input:focus,.field textarea:focus{border-color:var(--sage);outline:none;box-shadow:0 0 0 3px var(--sage-soft)}
#authForm .check{border:0;padding:16px 0 0}
#authForm .btn.wide{margin-top:22px}
.form-error{margin-top:14px;color:var(--plum);background:var(--plum-soft);padding:10px 14px;border-radius:10px;font-size:.95rem}
.demo-note{margin-top:18px;font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.status{display:inline-block;font-size:.85rem;padding:3px 10px;border-radius:99px;background:var(--mist);color:var(--ink);white-space:nowrap}
.status.s-pending{background:color-mix(in srgb,var(--signal) 22%,var(--surface))}
.status.s-accepted{background:var(--sage-soft);color:var(--sage)}
.status.s-done{background:var(--sage);color:var(--sage-ink)}
.status.s-declined,.status.s-cancelled{background:var(--plum-soft);color:var(--plum)}
.req-list{display:grid;gap:14px;margin-top:16px}
.req{border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--surface)}
.req>*+*{margin-top:10px}
.req-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.req-top b{font-family:var(--display);font-size:1.15rem}
blockquote{margin:10px 0 0;border-left:3px solid var(--line);padding:4px 0 4px 14px;color:var(--muted);font-style:italic}
.note{margin-top:12px;background:var(--sage-soft);border-radius:12px;padding:12px 14px}
.note b{font-size:.9rem}
.note p{margin-top:4px;white-space:pre-line}
.req-mini{list-style:none;padding:0;margin:12px 0 0}
.req-mini li{padding:10px 0;border-top:1px solid var(--line)}
.board-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-top:28px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sage)}
.tabs button span{margin-left:8px;font-size:.8rem;background:var(--mist);border-radius:99px;padding:1px 8px}
.coach-layout{display:grid;grid-template-columns:1fr 340px;gap:28px;margin-top:28px;align-items:start}
.coach-layout aside{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.coach-layout .score-head{grid-template-columns:auto 1fr}
.coach-layout .dial{width:140px;height:140px}
.coach-layout .dial b{font-size:2.6rem}
.prep-list{list-style:none;padding:0;margin:12px 0 0}
.prep-list li{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft);color:var(--sage);font-weight:700}
.slots{list-style:none;padding:0;margin:14px 0 0}
.slots li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.slots li span::first-letter{text-transform:uppercase}
.coach-list{display:grid;gap:10px;margin:18px 0 4px;max-height:280px;overflow:auto}
.coach-card .bio{display:block;color:var(--muted);font-size:.9rem;margin-top:6px}
.danger-zone{justify-content:space-between;margin-top:24px}
dialog{max-width:600px}
@media (max-width:860px){
  .auth,.coach-layout{grid-template-columns:1fr}
  .coach-layout aside{position:static}
  .auth-side .orb{display:none}
  .who-chip span{display:none}

<header class="bar">
  <div class="wrap">
    <button class="brand" data-go="home" aria-label="Accueil"><i aria-hidden="true"></i>Répétition</button>
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>

    <div id="account"></div>
  </div>
</header>
<main id="app" class="wrap" tabindex="-1"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* Répétition — POC AI Interview Platform (v6 : transcription Kyutai STT) */
const RUBRIC_VERSION = "v1.0";
/* ==========================================================================
   Contrat de profil candidat — candidate-profile-v1 (S2-01 → S2-02)
   Source unique : utilisée par le Worker (validation serveur) et intégrée
   telle quelle dans l'interface (validation client et mode démo).
   ========================================================================== */
const PROFILE_VERSION = "candidate-profile-v1";

const PC = {
  STATUSES: {
    student: "Étudiant·e",
    graduate: "Jeune diplômé·e",
    employed: "Salarié·e ou en poste",
    jobseeker: "En recherche d’emploi",
    reconversion: "En reconversion",
    other: "Autre situation",
  },
  DEGREES: { bac: "Baccalauréat", bac2: "Bac+2 (BTS, DUT, DEUG…)", bac3: "Licence / Bac+3", bac5: "Master / Ingénieur / Bac+5", phd: "Doctorat", other: "Autre formation" },
  GOALS: { first_job: "Décrocher un premier emploi", change_job: "Changer de poste ou d’entreprise", promotion: "Évoluer (promotion, nouvelles responsabilités)", general: "M’entraîner de façon générale" },
  REASONS: ["Gagner en confiance avant un vrai entretien", "Préparer un entretien précis", "Changer de secteur", "Progresser à l’oral", "Mieux valoriser mon parcours", "Préparer un retour à l’emploi"],
  AXES: { communication: "Communication", confidence: "Confiance en soi", structure: "Structurer mes réponses", knowledge: "Connaissances métier", stress: "Gestion du stress" },
  SECTORS: ["Technologies et logiciels", "Banque, finance, assurance", "Industrie", "Commerce et distribution", "Conseil", "Télécoms", "Santé", "Éducation et formation", "Administration publique", "Énergie", "Transport et logistique", "Tourisme et hôtellerie", "BTP et immobilier", "Médias et communication", "Agroalimentaire", "Associatif"],
  LANGUAGES: ["Français", "Anglais", "Arabe", "Amazigh", "Espagnol", "Allemand", "Italien", "Portugais", "Néerlandais", "Turc", "Chinois", "Japonais"],
  CEFR: {
    A1: ["Débutant", "Je comprends et utilise quelques expressions très simples."],
    A2: ["Élémentaire", "Je peux échanger sur des sujets simples et familiers."],
    B1: ["Intermédiaire", "Je peux converser sur des sujets courants et décrire mes expériences."],
    B2: ["Intermédiaire avancé", "Je peux participer à des discussions professionnelles et expliquer mes idées clairement."],
    C1: ["Avancé", "Je m’exprime avec aisance sur des sujets complexes."],
    C2: ["Maîtrise", "Je comprends presque tout et m’exprime avec précision et nuance."],
  },
  UI_LANGS: { fr: "Français", en: "English" },
  JOBS: ["Développeur·se web", "Développeur·se full-stack", "Développeur·se mobile", "Ingénieur·e logiciel", "Ingénieur·e DevOps", "Data analyst", "Data scientist", "Data engineer", "Chef·fe de projet", "Product manager", "Product owner", "Scrum master", "Chargé·e RH", "Chargé·e de recrutement", "Responsable RH", "Commercial·e", "Business developer", "Account manager", "Chargé·e de clientèle", "Chargé·e de marketing", "Community manager", "Contrôleur·se de gestion", "Comptable", "Analyste financier·ère", "Auditeur·rice", "Designer UX/UI", "Consultant·e", "Juriste", "Assistant·e de direction", "Technicien·ne support", "Administrateur·rice systèmes et réseaux", "Ingénieur·e cybersécurité", "Acheteur·se", "Logisticien·ne", "Ingénieur·e industriel·le", "Enseignant·e", "Infirmier·ère"],
  // Familles de métiers : mots-clés → suggestions déterministes (fallback sans IA)
  FAMILIES: {
    dev: { kw: ["dévelop", "develop", "logiciel", "software", "web", "front", "back", "full", "mobile", "devops", "programm"], role: "dev",
      skills: ["JavaScript", "Python", "Java", "SQL", "Git", "API REST", "Tests automatisés", "React", "Node.js", "Docker", "Architecture logicielle", "Sécurité applicative", "Revue de code", "Méthodes agiles"] },
    data: { kw: ["data", "donnée", "analyst", "analyste", "bi ", "business intelligence", "scien", "statisti"], role: "data",
      skills: ["SQL", "Python", "Excel avancé", "Power BI", "Tableau", "Statistiques", "Machine learning", "Nettoyage de données", "Visualisation", "Storytelling avec les données", "Modélisation", "A/B testing"] },
    rh: { kw: ["rh", "ressources humaines", "recrut", "talent", "paie", "human"], role: "rh",
      skills: ["Recrutement", "Conduite d’entretien", "Droit du travail", "Onboarding", "Gestion de la paie", "SIRH", "Marque employeur", "Relations sociales", "Gestion des compétences", "Formation"] },
    sales: { kw: ["commercial", "vente", "sales", "business dev", "account", "clientèle", "client"], role: "sales",
      skills: ["Prospection", "Négociation", "Découverte des besoins", "Traitement des objections", "CRM", "Closing", "Fidélisation", "Gestion de portefeuille", "Pitch", "Prévisions de ventes"] },
    pm: { kw: ["projet", "project", "product", "scrum", "pmo", "owner"], role: "pm",
      skills: ["Planification", "Gestion des risques", "Gestion budgétaire", "Méthodes agiles", "Animation d’équipe", "Gestion des parties prenantes", "Priorisation", "Jira", "Rédaction de spécifications", "Reporting"] },
    finance: { kw: ["compta", "financ", "gestion", "audit", "contrôl"], role: null,
      skills: ["Comptabilité générale", "Analyse financière", "Excel avancé", "Contrôle de gestion", "Normes IFRS", "Fiscalité", "Audit", "Reporting financier", "ERP (SAP…)", "Budget et prévisions"] },
    marketing: { kw: ["marketing", "communication", "community", "brand", "contenu"], role: null,
      skills: ["Stratégie de contenu", "Réseaux sociaux", "SEO", "Google Analytics", "Rédaction", "Gestion de campagnes", "Marketing automation", "Étude de marché", "Événementiel", "Relations presse"] },
    design: { kw: ["design", "ux", "ui", "graph"], role: null,
      skills: ["Figma", "Recherche utilisateur", "Prototypage", "Design system", "Accessibilité", "Tests utilisateurs", "Architecture de l’information", "Design d’interface"] },
  },
  SOFT_SKILLS: ["Communication orale", "Travail en équipe", "Organisation", "Résolution de problèmes", "Adaptabilité", "Esprit d’analyse", "Leadership", "Gestion du stress", "Prise de parole en public", "Anglais professionnel"],
};

function jobFamily(job) {
  const j = ` ${String(job || "").toLowerCase()} `;
  for (const [k, f] of Object.entries(PC.FAMILIES)) if (f.kw.some((w) => j.includes(w))) return k;
  return null;
}
function suggestedSkills(job) {
  const f = jobFamily(job);
  return [...(f ? PC.FAMILIES[f].skills : []), ...PC.SOFT_SKILLS];
}
/** Séniorité initiale : uniquement d'après l'expérience déclarée (décision Q8). */
function deriveSeniority(status, years) {
  const y = Number(years) || 0;
  let level;
  if (status === "student" && y < 2) level = "student";
  else if (y < 2) level = "junior";
  else if (y < 5) level = "mid";
  else level = "senior";
  return { level, years: y, basis: "declared_experience" };
}
const SENIORITY_LABEL = { student: "Étudiant·e", junior: "Junior (0 à 2 ans)", mid: "Confirmé·e (2 à 5 ans)", senior: "Senior (5 ans et plus)" };

const isProStatus = (s) => s === "employed" || s === "jobseeker";
const isEduStatus = (s) => s === "student" || s === "graduate";
const txt = (v, max) => String(v ?? "").replace(/\s+/g, " ").trim().slice(0, max);
const list = (v, max, n) => (Array.isArray(v) ? v : []).map((x) => txt(x, max)).filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).slice(0, n);
const num = (v) => (v === "" || v === null || v === undefined ? NaN : Number(String(v).replace(",", ".")));

/**
 * Valide une étape (1 à 5) ou le profil complet (step = "all").
 * Retourne { ok, errors: {champ: message}, warnings: {champ: message}, value } ; value = profil normalisé.
 * Règles : seules les questions secondaires sont facultatives (Q10) ; rien d'inventé pour une question ignorée.
 */
function validateProfile(d, step = "all") {
  d = d || {};
  const E = {}, W = {}, all = step === "all", at = (n) => all || step === n;
  const sit = d.situation || {}, bg = d.background || {}, mo = d.motivation || {}, la = d.languages || {}, sk = d.skills || {};
  const status = Object.keys(PC.STATUSES).includes(sit.status) ? sit.status : null;
  const out = { version: PROFILE_VERSION };

  // Écran 1 — Situation et métier
  out.situation = { status, targetJob: txt(sit.targetJob, 80), currentJob: txt(sit.currentJob, 80) || null, specialization: txt(sit.specialization, 80) || null };
  if (at(1)) {
    if (!status) E["situation.status"] = "Choisissez votre situation actuelle.";
    if (out.situation.targetJob.length < 2) E["situation.targetJob"] = "Indiquez le métier que vous visez.";
    if ((isProStatus(status) || status === "reconversion") && (!out.situation.currentJob || out.situation.currentJob.length < 2))
      E["situation.currentJob"] = status === "reconversion" ? "Indiquez votre métier d’origine." : status === "jobseeker" ? "Indiquez votre dernier poste." : "Indiquez votre poste actuel.";
  }
  if (!(isProStatus(status) || status === "reconversion")) out.situation.currentJob = null;

  // Écran 2 — Parcours et expérience
  const years = num(bg.yearsExperience);
  out.background = { yearsExperience: Number.isFinite(years) ? Math.round(years * 2) / 2 : null };
  if (isEduStatus(status)) {
    const ed = bg.education || {};
    out.background.education = {
      degree: Object.keys(PC.DEGREES).includes(ed.degree) ? ed.degree : null, field: txt(ed.field, 100),
      institution: txt(ed.institution, 120) || null, internships: list(ed.internships, 160, 6), projects: list(ed.projects, 160, 6),
      firstExperiences: status === "graduate" ? list(ed.firstExperiences, 160, 6) : [],
    };
  }
  if (isProStatus(status)) {
    const pr = bg.professional || {}; const yr = num(pr.yearsInRole);
    out.background.professional = { yearsInRole: Number.isFinite(yr) ? Math.round(yr * 2) / 2 : null, sectors: list(pr.sectors, 60, 6), responsibilities: txt(pr.responsibilities, 600) || null };
  }
  if (status === "reconversion") {
    const rc = bg.reconversion || {};
    out.background.reconversion = { transferable: txt(rc.transferable, 600) || null, reason: txt(rc.reason, 300) || null };
  }
  if (status === "other") out.background.description = txt(bg.description, 400) || null;
  if (at(2) && status) {
    if (!Number.isFinite(years)) E["background.yearsExperience"] = "Indiquez votre nombre d’années d’expérience (0 si aucune).";
    else if (years < 0 || years > 50) E["background.yearsExperience"] = "Indiquez un nombre entre 0 et 50.";
    else if (isEduStatus(status) && years > 8) W["background.yearsExperience"] = `${years} ans d’expérience pour un statut ${status === "student" ? "étudiant" : "jeune diplômé"} : vérifiez la valeur ou votre situation.`;
    else if (isProStatus(status) && years === 0) W["background.yearsExperience"] = "0 an d’expérience pour une personne en poste : vérifiez la valeur.";
    if (isEduStatus(status)) {
      if (!out.background.education.degree) E["background.education.degree"] = "Choisissez votre niveau de diplôme (en cours ou obtenu).";
      if (out.background.education.field.length < 2) E["background.education.field"] = "Indiquez votre formation ou spécialité.";
    }
    if (isProStatus(status)) {
      const yr = out.background.professional.yearsInRole;
      if (yr !== null && (yr < 0 || (Number.isFinite(years) && yr > years))) E["background.professional.yearsInRole"] = "Les années dans ce poste ne peuvent pas dépasser votre expérience totale.";
      if (!out.background.professional.sectors.length) E["background.professional.sectors"] = "Choisissez au moins un secteur.";
    }
  }

  // Écran 3 — Motivations et objectifs
  out.motivation = { goal: Object.keys(PC.GOALS).includes(mo.goal) ? mo.goal : null, reasons: list(mo.reasons, 120, 8), reasonText: txt(mo.reasonText, 200) || null, axes: list(mo.axes, 20, 5).filter((a) => a in PC.AXES) };
  if (at(3) && status) {
    if (!out.motivation.goal) E["motivation.goal"] = "Choisissez votre objectif principal.";
    if (!out.motivation.reasons.length && !out.motivation.reasonText) E["motivation.reasons"] = "Choisissez une motivation ou écrivez-la en quelques mots.";
    if (!out.motivation.axes.length) E["motivation.axes"] = "Choisissez au moins un axe de progression.";
  }

  // Écran 4 — Langues
  const seen = new Set();
  out.languages = {
    spoken: (Array.isArray(la.spoken) ? la.spoken : []).map((l) => ({ language: txt(l && l.language, 40), level: l && l.level in PC.CEFR ? l.level : null, selfDeclared: true }))
      .filter((l) => l.language && !seen.has(l.language.toLowerCase()) && seen.add(l.language.toLowerCase())).slice(0, 8),
    preferredInterface: la.preferredInterface in PC.UI_LANGS ? la.preferredInterface : null,
  };
  if (at(4) && status) {
    if (!out.languages.spoken.length) E["languages.spoken"] = "Ajoutez au moins une langue.";
    else if (out.languages.spoken.some((l) => !l.level)) E["languages.spoken"] = "Choisissez un niveau pour chaque langue.";
    if (!out.languages.preferredInterface) E["languages.preferredInterface"] = "Choisissez votre langue préférée pour l’interface.";
  }

  // Écran 5 — Compétences et intérêts (acquises ≠ à développer)
  const skill = (s) => ({ label: txt(s && s.label, 60), source: ["catalog", "ai", "free"].includes(s && s.source) ? s.source : "free" });
  const uniq = (arr) => { const k = new Set(); return arr.filter((s) => s.label && !k.has(s.label.toLowerCase()) && k.add(s.label.toLowerCase())); };
  const acquired = uniq((Array.isArray(sk.acquired) ? sk.acquired : []).map(skill)).slice(0, 20);
  const acqKeys = new Set(acquired.map((s) => s.label.toLowerCase()));
  out.skills = { acquired, toDevelop: uniq((Array.isArray(sk.toDevelop) ? sk.toDevelop : []).map(skill)).filter((s) => !acqKeys.has(s.label.toLowerCase())).slice(0, 20) };
  if (at(5) && status && !out.skills.toDevelop.length) E["skills.toDevelop"] = "Choisissez au moins un sujet à développer.";

  out.seniority = deriveSeniority(status, out.background.yearsExperience);
  return { ok: !Object.keys(E).length, errors: E, warnings: W, value: out };
}


/* ---------- Catalogue (S1-07) ---------- */
const ROLES = {
  dev:   {fr:"Développeur·se web", en:"Web developer", kw:["api","code","test","bug","déploi","deploy","git","javascript","performance","sécurité","security","base de données","database","refactor","front","back","review","sprint"]},

/* ---------- Analyse déterministe ---------- */
const RX = {
  situation:/\b(quand|lorsque|chez|dans le cadre|au sein|pendant|lors d|à l[’']époque|contexte|situation|projet|stage|when|while|at my|during|project|internship)\b/i,
  task:/\b(objectif|mission|je devais|il fallait|mon rôle|responsable|chargé|but|goal|task|my role|in charge|needed to|had to)\b/i,
  action:/\b(j[’']ai|nous avons|on a|je suis|j[’']ai mis|mis en place|organisé|analysé|proposé|développé|contacté|i |we |implemented|built|organized|analyzed|proposed|led|created|set up)/i,
  result:/(résultat|ainsi|ce qui a permis|permis de|au final|finalement|grâce à|augment|réduit|diminu|gagné|économis|amélior|%|result|as a result|which led|increased|reduced|saved|improved|in the end)/i,
  filler:/\b(euh+|heu+|genre|en fait|du coup|voilà|tu vois|bah|ben|um+|uh+|like|you know|basically|actually)\b/gi,
  number:/\d+([.,]\d+)?\s*(%|k|€|dh|mad|jours|semaines|mois|ans|heures|personnes|clients|days|weeks|months|years|hours|people|users)?/gi
};
function words(t){return (t.trim().match(/[\p{L}\p{N}’'-]+/gu)||[]).length}
function analyse(text, role){
  const w=words(text), sentences=text.split(/[.!?…]+/).filter(s=>words(s)>0);
  const avgLen = sentences.length? w/sentences.length : w;
  const star = ["situation","task","action","result"].filter(k=>RX[k].test(text));
  const nums=(text.match(RX.number)||[]).length, fill=(text.match(RX.filler)||[]).length;
  const low=text.toLowerCase(); const kw=(ROLES[role]?.kw||[]).filter(k=>low.includes(k));
  return {w, avgLen, star, nums, fill, kw};
}
const clamp=(n)=>Math.max(1,Math.min(5,Math.round(n)));
function scoreTurn(a){
  const s={};
  s.structure = clamp(1 + a.star.length + (a.w>60?0.5:0) - (a.w<25?1:0));
  s.concrete  = clamp(1 + Math.min(2,a.nums) + (a.w>70?1:0) + (a.star.includes("situation")?1:0) - (a.w<25?1:0));
  s.relevance = clamp(1.5 + Math.min(3,a.kw.length) + (a.w>50?0.5:0));
  let c=5; if(a.avgLen>32)c-=1.5; if(a.avgLen>45)c-=1; if(a.w<25)c-=2.5; else if(a.w<60)c-=1.5; else if(a.w<80)c-=0.5; if(a.w>320)c-=1; c-=Math.min(2,a.fill*0.5);
  s.clarity = clamp(c);
  s.impact = clamp(1 + (a.star.includes("result")?2:0) + Math.min(2,a.nums));
  return s;
}

function localFollowup(text, lang){
  const a=analyse(text,""); const en=lang==="en";
  if(a.w<30) return en?"Could you develop that with a concrete example?":"Pouvez-vous développer avec un exemple concret ?";
  if(!a.star.includes("action")) return en?"What did you do personally, step by step?":"Qu’avez-vous fait personnellement, étape par étape ?";
  if(!a.star.includes("result")) return en?"And what was the outcome? Ideally with a figure.":"Et quel a été le résultat ? Idéalement avec un chiffre.";
  return null;
}


function evaluate(L){
  const answered=L.turns.filter(t=>!t.skipped&&words(t.answer)>=3);
  const base={rubricVersion:RUBRIC_VERSION,engine:"local-rules",createdAt:new Date().toISOString()};
  const minAns=L.drill?1:3;
  if(answered.length<minAns) return {...base,status:"not_evaluable",reason:`Seulement ${answered.length} réponse${answered.length>1?"s":""} exploitable${answered.length>1?"s":""}. Il en faut au moins ${minAns} pour un retour fiable.`};
  const per=answered.map(t=>{const a=analyse(t.answer,L.role);return {t,a,s:scoreTurn(a)}});
  const criteria=RUBRIC.criteria.map(c=>{
    const vals=per.map(p=>p.s[c.key]); const level=Math.round(vals.reduce((x,y)=>x+y,0)/vals.length*10)/10;
    const best=per.reduce((m,p)=>p.s[c.key]>m.s[c.key]?p:m), worst=per.reduce((m,p)=>p.s[c.key]<m.s[c.key]?p:m);
    const ev=level>=3.5?best:worst;
    return {key:c.key,label:c.label,level,evidence:{seq:ev.t.seq,comp:ev.t.comp,excerpt:excerpt(ev.t.answer,c.key)},rationale:rationale(c.key,level,per)};
  });
  const overall=Math.round(criteria.reduce((x,c)=>x+c.level,0)/criteria.length*20);
  return {...base,status:"evaluated",overall,criteria,answered:answered.length,skipped:L.turns.filter(t=>t.skipped).length};
}
function excerpt(text,key){
  const sents=text.split(/(?<=[.!?…])\s+/).filter(Boolean);
  const pick={structure:RX.situation,concrete:RX.number,relevance:null,clarity:null,impact:RX.result}[key];
  let s=pick?sents.find(x=>{pick.lastIndex=0;return pick.test(x)}):null; s=s||sents[0]||text;
  return s.length>180?s.slice(0,177)+"…":s;
}
function rationale(key,level,per){
  const avg=(f)=>per.reduce((x,p)=>x+f(p.a),0)/per.length;
  const starAvg=avg(a=>a.star.length), nums=per.reduce((x,p)=>x+p.a.nums,0), fill=per.reduce((x,p)=>x+p.a.fill,0), w=Math.round(avg(a=>a.w)), kw=new Set(per.flatMap(p=>p.a.kw));
  switch(key){
    case "structure": return `En moyenne, vos réponses contiennent ${starAvg.toFixed(1)} des 4 étapes STAR (contexte, mission, action, résultat).`;
    case "concrete": {const without=per.filter(p=>!p.a.nums).length; return nums?`${nums} élément${nums>1?"s":""} chiffré${nums>1?"s":""} au total${without?`, mais ${without} réponse${without>1?"s":""} sur ${per.length} sans aucun fait mesurable`:", présents dans chaque réponse"}.`:"Aucun chiffre ni élément mesurable dans vos réponses : les exemples restent généraux.";}
    case "relevance": return kw.size?`Vocabulaire métier repéré : ${[...kw].slice(0,6).join(", ")}.`:"Peu de vocabulaire propre au métier visé : reliez davantage vos réponses au poste.";
    case "clarity": return `Réponses de ${w} mots en moyenne${fill?`, ${fill} mot${fill>1?"s":""} de remplissage repéré${fill>1?"s":""}`:", sans mots de remplissage"}. La cible se situe entre 80 et 220 mots.`;
    case "impact": return level>=3.5?"Vous montrez souvent l’effet de vos actions.":"Vous décrivez ce que vous avez fait, mais rarement ce que cela a changé.";
  }
}

function buildPlan(P){
  const n=P.length==="short"?5:7, maxLvl={junior:1,mid:2,senior:2}[P.level]??1;
  const minLvl=P.level==="senior"?1:0;
  const roleQ=Q.filter(q=>q.role===P.role&&q.lvl<=maxLvl);
  let beh=Q.filter(q=>q.kind==="rh"&&!["pitch","close"].includes(q.id)&&q.lvl<=maxLvl&&q.lvl>=Math.min(minLvl,1));
  if(P.level==="senior")beh.sort((a,b)=>b.lvl-a.lvl);
  if((P.goals||[]).includes("examples"))beh.sort((a,b)=>(["challenge","fail","conflict"].includes(b.id))-(["challenge","fail","conflict"].includes(a.id)));
  const nTech=P.type==="tech"?n-2:P.type==="rh"?0:Math.min(roleQ.length,Math.round((n-2)/2));
  const tech=(P.level==="senior"?[...roleQ].reverse():roleQ).slice(0,nTech);
  const middle=[...tech,...beh.slice(0,n-2-tech.length)];
  // alternance comportemental / technique
  const a=middle.filter(q=>q.kind==="rh"),b=middle.filter(q=>q.kind==="tech"),mix=[];
  while(a.length||b.length){if(a.length)mix.push(a.shift());if(b.length)mix.push(b.shift())}
  const plan=[Q.find(q=>q.id==="pitch"),...mix,Q.find(q=>q.id==="close")];
  return plan.slice(0,n);
}

async function fetchAiSkills(job){
  OB.ai={job,state:API.ai&&job?"loading":"off",skills:[]};
  if(!API.ai||!job)return;
  try{
    const r=await Promise.race([call("POST","/api/ai/suggest-skills",{job}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),5000))]);
    if(OB.ai.job!==job)return; OB.ai.skills=(r.skills||[]).slice(0,10); OB.ai.state=OB.ai.skills.length?"ready":"error";
  }catch(e){if(OB.ai.job===job){OB.ai.state="error"}}
  if(S.screen==="onboard"&&OB.step===5)renderOnboard(false);
}

function bindOnboard(){

  f.querySelectorAll("[data-langother]").forEach(i=>i.oninput=()=>{L()[+i.dataset.langother].language=i.value.trim();upd("languages.spoken",L(),false)});
  f.querySelectorAll("[data-lvl]").forEach(r=>r.onchange=()=>{L()[+r.dataset.lvl].level=r.value;upd("languages.spoken",L(),true)});

function rerenderKeepFocus(){

function gotoStep(n,validate){

async function submitStep(){
  const n=OB.step;
  if(OB.mode==="edit"){
    const v=validateProfile(OB.data,"all"); OB.errors=v.errors;
    if(!v.ok){OB.step=+(Object.keys(v.errors)[0]==="situation.status"?1:OB.step);return renderOnboard(false)}
    try{const r=await call("PUT","/api/profile",{data:OB.data});OB.profile=r.profile;OB.data=JSON.parse(JSON.stringify(r.profile));toast("Profil mis à jour");go("profile")}
    catch(e){OB.errors=e.errors||{};toast(e.message);renderOnboard(false)}
    return;
  }
  if(n<6){
    const v=validateProfile(OB.data,n); OB.errors=v.errors; OB.warnings=v.warnings;
    if(!v.ok)return renderOnboard(false);
    if(OB.fromRecap){OB.fromRecap=false;return gotoStep(6)}
    return gotoStep(n+1);
  }
  // Finalisation : validation complète, enregistrement unique via S2-02
  const v=validateProfile(OB.data,"all");
  if(!v.ok){const first=Object.keys(v.errors)[0];const stepOf={situation:1,background:2,motivation:3,languages:4,skills:5}[first.split(".")[0]];OB.fromRecap=true;OB.step=stepOf;OB.errors=validateProfile(OB.data,stepOf).errors;return renderOnboard(false)}
  const btn=$("#obFinish"); busy(btn,true,"Enregistrement…"); clearTimeout(saveTimer);
  try{
    const r=await call("POST","/api/onboarding/complete",{data:OB.data});
    OB.profile=r.profile; OB.status="done"; OB.mode="edit"; applyProfileToSim(r.profile,true); go("welcome");
  }catch(e){busy(btn,false);toast(e.message)}
}

function applyProfileToSim(p,force){
  if(!p)return; const sim=S.prefs.profile;
  if(force||!sim.role){const fam=jobFamily(p.situation.targetJob);sim.role=fam&&PC.FAMILIES[fam].role||sim.role||null}
  sim.level={student:"junior",junior:"junior",mid:"mid",senior:"senior"}[p.seniority.level];
  if(force||!sim.lang)sim.lang=p.languages.preferredInterface==="en"?"en":"fr";
  const map={communication:"pitch",confidence:"confidence",stress:"confidence",structure:"structure",knowledge:"tech"};
  sim.goals=[...new Set(p.motivation.axes.map(a=>map[a]).filter(Boolean))];
  if(p.situation.status==="student"||p.situation.status==="graduate"||p.motivation.goal==="first_job")sim.goals.push("examples");
  savePrefs();
}

const API={mode:"remote",ai:false,coachSignup:true};
class ApiError extends Error{constructor(status,code,message,errors){super(message);this.status=status;this.code=code;this.errors=errors}}
async function call(method,path,body){
  if(API.mode==="demo")return Demo.handle(method,path,body);
  let r;
  try{r=await fetch(path,{method,credentials:"same-origin",headers:body!==undefined?{"Content-Type":"application/json"}:{},body:body!==undefined?JSON.stringify(body):undefined})}
  catch(e){throw new ApiError(0,"network","Connexion impossible. Vérifiez votre réseau et réessayez.")}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new ApiError(r.status,j.error||"error",j.message||"Une erreur est survenue.",j.errors);
  return j;
}

/* ---------- Backend de démonstration (localStorage) ---------- */
const Demo=(()=>{
  const KEY="repetition.demo.db.v2", INVITE="COACH-DEMO";
  let db;
  const load=()=>{try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}if(!db)db={users:[],sessions:[],requests:[],notes:[],profiles:{},current:null,seeded:false};db.drafts=db.drafts||{};db.cprofiles=db.cprofiles||{}};
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
  const now=()=>new Date().toISOString(), uid=(p)=>p+"_"+crypto.getRandomValues(new Uint32Array(2)).join("").slice(0,14);
  const err=(s,c,m)=>{throw new ApiError(s,c,m)};
  async function hash(pw,salt){
    salt=salt||[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,"0")).join("");
    if(crypto.subtle){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
      const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:new TextEncoder().encode(salt),iterations:20000},k,256);
      return {hash:[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join(""),salt}}
    return {hash:btoa(salt+pw),salt};
  }
  async function seed(){
    if(db.seeded)return; db.seeded=true;
    const h=await hash("demo1234"), id="u_democoach";
    db.users.push({id,email:"coach@demo.local",name:"Nadia Benali",role:"coach",pw:h.hash,salt:h.salt,createdAt:now()});
    const d=(days,hour)=>{const x=new Date();x.setDate(x.getDate()+days);x.setHours(hour,0,0,0);return x.toISOString()};
    db.profiles[id]={bio:"Coach carrière depuis 8 ans, ancienne recruteuse tech. J’aide les candidat·es à structurer leurs réponses et à gagner en aisance.",specialties:["Entretien RH","Technique dev","Prise de parole"],slots:[d(1,10),d(1,14),d(2,18),d(4,9)]};
    persist();
  }
  const me=()=>db.users.find(u=>u.id===db.current)||null;
  const pub=(u)=>u&&({id:u.id,email:u.email,name:u.name,role:u.role});
  const need=(role)=>{const u=me();if(!u)err(401,"unauthenticated","Connectez-vous pour continuer.");if(role&&u.role!==role)err(403,"forbidden","Cette action n’est pas autorisée pour votre profil.");return u};
  const T={coach:{pending:["accepted","declined"],accepted:["done"]},candidate:{pending:["cancelled"],accepted:["cancelled"]}};
  async function handle(method,path,b){
    if(!db)load(); await seed();
    const clone=(x)=>JSON.parse(JSON.stringify(x));
    let m;
    if(path==="/api/auth/register"&&method==="POST"){
      const email=String(b.email||"").trim().toLowerCase(), name=String(b.name||"").trim(), role=b.role==="coach"?"coach":"candidate";
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))err(400,"invalid_email","Adresse e-mail invalide.");
      if(name.length<2)err(400,"invalid_name","Indiquez votre nom (2 caractères minimum).");
      if(String(b.password||"").length<8)err(400,"weak_password","Le mot de passe doit contenir au moins 8 caractères.");
      if(role==="coach"&&b.inviteCode!==INVITE)err(403,"bad_invite","Code d’invitation coach incorrect.");
      if(role==="candidate"&&!b.consent)err(400,"consent_required","Le consentement au traitement de vos réponses est nécessaire.");
      if(db.users.some(u=>u.email===email))err(409,"email_taken","Un compte existe déjà avec cette adresse.");
      const h=await hash(b.password), u={id:uid("u"),email,name,role,pw:h.hash,salt:h.salt,createdAt:now(),consents:role==="candidate"?[{purpose:"processing",version:"consent-v0.1",grantedAt:now()}]:[]};
      db.users.push(u); if(role==="coach")db.profiles[u.id]={bio:"",specialties:[],slots:[]};
      db.current=u.id; persist(); return {user:pub(u)};
    }
    if(path==="/api/auth/login"&&method==="POST"){
      const u=db.users.find(x=>x.email===String(b.email||"").trim().toLowerCase());
      if(!u||(await hash(String(b.password||""),u.salt)).hash!==u.pw)err(401,"bad_credentials","E-mail ou mot de passe incorrect.");
      db.current=u.id; persist(); return {user:pub(u)};
    }
    if(path==="/api/auth/logout"){db.current=null;persist();return {ok:true}}
    if(path==="/api/auth/me")return {user:pub(me())};
    if(path==="/api/me"&&method==="DELETE"){
      const u=need(); const rq=db.requests.filter(r=>r.candidateId===u.id||r.coachId===u.id).map(r=>r.id);
      db.notes=db.notes.filter(n=>!rq.includes(n.requestId)); db.requests=db.requests.filter(r=>!rq.includes(r.id));
      db.sessions=db.sessions.filter(s=>s.candidateId!==u.id); delete db.profiles[u.id]; delete db.drafts[u.id]; delete db.cprofiles[u.id]; db.users=db.users.filter(x=>x.id!==u.id); db.current=null; persist(); return {ok:true};
    }
    if(path==="/api/onboarding"&&method==="GET"){const u=need("candidate");const p=db.cprofiles[u.id],d=db.drafts[u.id];return {completed:!!p,profile:p?clone(p.data):null,completedAt:p?p.completedAt:null,draft:d?clone(d):null}}
    if(path==="/api/onboarding/draft"&&method==="PUT"){const u=need("candidate");if(db.cprofiles[u.id])err(409,"already_completed","Votre profil est déjà enregistré.");const t=now();db.drafts[u.id]={step:Math.max(1,Math.min(6,parseInt(b.step,10)||1)),data:clone(b.data||{}),updatedAt:t};persist();return {ok:true,savedAt:t}}
    if(path==="/api/onboarding/complete"&&method==="POST"){const u=need("candidate");const v=validateProfile(b.data,"all");if(!v.ok)throw new ApiError(400,"invalid_profile","Certaines réponses sont incomplètes.",v.errors);
      const created=!db.cprofiles[u.id];if(created){db.cprofiles[u.id]={data:v.value,completedAt:now()};delete db.drafts[u.id];persist()}return {created,profile:clone(db.cprofiles[u.id].data)}}
    if(path==="/api/profile"&&method==="PUT"){const u=need("candidate");if(!db.cprofiles[u.id])err(404,"no_profile","Terminez d’abord votre onboarding.");const v=validateProfile(b.data,"all");if(!v.ok)throw new ApiError(400,"invalid_profile","Certaines réponses sont incomplètes.",v.errors);db.cprofiles[u.id].data=v.value;persist();return {profile:clone(v.value)}}
    if(path==="/api/sessions"&&method==="GET"){const u=need("candidate");return {sessions:clone(db.sessions.filter(s=>s.candidateId===u.id).map(s=>s.data))}}
    if((m=path.match(/^\/api\/sessions\/([\w-]+)$/))&&method==="PUT"){
      const u=need("candidate"); const ex=db.sessions.find(s=>s.id===m[1]);
      if(ex&&ex.candidateId!==u.id)err(404,"not_found","Simulation introuvable.");
      if(ex)ex.data=clone(b); else db.sessions.push({id:m[1],candidateId:u.id,data:clone(b)}); persist(); return {ok:true};
    }
    if(path==="/api/coaches"){need();const t=now();return {coaches:db.users.filter(u=>u.role==="coach").map(u=>({id:u.id,name:u.name,...clone(db.profiles[u.id]||{bio:"",specialties:[],slots:[]}),slots:(db.profiles[u.id]?.slots||[]).filter(s=>s>t).sort()}))}}
    if(path==="/api/coach/profile"){
      const u=need("coach");
      if(method==="PUT"){db.profiles[u.id]={bio:String(b.bio||"").slice(0,600),specialties:(b.specialties||[]).slice(0,10),slots:(b.slots||[]).filter(s=>!isNaN(Date.parse(s))).map(s=>new Date(s).toISOString()).slice(0,50)};persist()}
      const p=db.profiles[u.id]||{bio:"",specialties:[],slots:[]}; return {profile:{...clone(p),slots:[...p.slots].sort()}};
    }
    if(path==="/api/requests"&&method==="POST"){
      const u=need("candidate");
      if(!b.share)err(400,"share_required","Autorisez le partage de la simulation pour que le coach puisse la préparer.");
      if(!db.users.some(x=>x.id===b.coachId&&x.role==="coach"))err(404,"coach_not_found","Coach introuvable.");
      if(!db.sessions.some(s=>s.id===b.sessionId&&s.candidateId===u.id))err(404,"session_not_found","Simulation introuvable.");
      if(db.requests.some(r=>r.sessionId===b.sessionId&&r.coachId===b.coachId&&["pending","accepted"].includes(r.status)))err(409,"duplicate","Une demande est déjà en cours avec ce coach pour cette simulation.");
      const r={id:uid("r"),candidateId:u.id,coachId:b.coachId,sessionId:b.sessionId,slot:b.slot||null,message:String(b.message||"").slice(0,1000),shared:true,status:"pending",createdAt:now(),updatedAt:now()};
      db.requests.push(r); persist(); return {id:r.id};
    }
    if(path==="/api/requests"&&method==="GET"){
      const u=need(); const name=(id)=>db.users.find(x=>x.id===id)?.name||"Compte supprimé";
      return {requests:db.requests.filter(r=>(u.role==="coach"?r.coachId:r.candidateId)===u.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).map(r=>{
        const s=db.sessions.find(x=>x.id===r.sessionId)?.data;
        return {...clone(r),candidateName:name(r.candidateId),coachName:name(r.coachId),session:s?{role:s.role,level:s.level,type:s.type,startedAt:s.startedAt,overall:s.evaluation?.overall??null}:null,notes:db.notes.filter(n=>n.requestId===r.id).map(n=>({content:n.content,createdAt:n.createdAt}))};
      })};
    }
    if((m=path.match(/^\/api\/requests\/([\w-]+)\/status$/))){
      const u=need(); const r=db.requests.find(x=>x.id===m[1]);
      if(!r||(u.role==="coach"?r.coachId:r.candidateId)!==u.id)err(404,"not_found","Demande introuvable.");
      if(!(T[u.role][r.status]||[]).includes(b.status))err(409,"bad_transition","Ce changement de statut n’est pas possible.");
      r.status=b.status; r.shared=!["cancelled","declined"].includes(b.status); r.updatedAt=now(); persist(); return {ok:true,status:r.status};
    }
    if((m=path.match(/^\/api\/requests\/([\w-]+)\/session$/))){
      const u=need("coach"); const r=db.requests.find(x=>x.id===m[1]&&x.coachId===u.id);
      if(!r||!r.shared||!["pending","accepted","done"].includes(r.status))err(404,"not_found","Simulation non partagée.");
      return {session:clone(db.sessions.find(s=>s.id===r.sessionId)?.data)};
    }
    if((m=path.match(/^\/api\/requests\/([\w-]+)\/notes$/))){
      const u=need("coach"); const r=db.requests.find(x=>x.id===m[1]&&x.coachId===u.id); const text=String(b.content||"").trim();
      if(!r)err(404,"not_found","Demande introuvable."); if(text.length<10)err(400,"too_short","Le compte rendu doit contenir au moins 10 caractères.");
      if(!["accepted","done"].includes(r.status))err(409,"not_accepted","Acceptez la demande avant d’écrire un compte rendu.");
      db.notes.push({id:uid("n"),requestId:r.id,content:text.slice(0,4000),createdAt:now()}); persist(); return {ok:true};
    }
    err(404,"not_found","Ressource introuvable.");
  }
  return {handle,INVITE};
})();

/* ---------- Session : machine à états, sauvegarde serveur ---------- */
const useCatalog=()=>API.mode==="remote"&&API.questionSource&&API.questionSource!=="builtin";
async function startSession(planIds,drill=false,custom=null,btn=null){
  const P=S.prefs.profile;
  const L={id:"s_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),status:"in_progress",startedAt:new Date().toISOString(),endedAt:null,role:P.role,level:P.level,type:P.type,lang:P.lang,
    rubricVersion:RUBRIC_VERSION,consentVersion:"consent-v0.1",plan:planIds||[],custom,idx:0,turns:[],followupAsked:false,pending:null,drill,evaluation:null,source:"builtin"};
  if(!drill&&!custom&&useCatalog()){
    busy(btn,true,"Préparation de l’entretien…");
    try{
      const r=await call("POST","/api/interview/start",{sessionId:L.id,role:P.role,level:P.level,type:P.type,lang:P.lang,length:P.length});
      Object.assign(L,{source:r.source,catalog:true,current:r.question,total:r.question.total});
    }catch(e){
      busy(btn,false);
      if(!["catalog_empty","catalog_unavailable","builtin_source"].includes(e.code)){toast(e.message);return}
      toast((e.code==="catalog_empty"?"Le référentiel officiel n’a pas encore de questions publiées pour ce profil":"Référentiel officiel indisponible")+" : simulation avec la banque intégrée.");
      if(!L.plan.length)L.plan=buildPlan(P).map(q=>q.id);
    }
  }
  S.live=L; S.sessions.push(snapshot()); persist(); go("interview");
}
/** Question courante, quelle que soit la source : référentiel S2-03, exercice ciblé ou banque intégrée. */
function currentQ(L){
  if(L.catalog&&L.current)return {id:L.current.code,comp:L.current.comp,kind:L.current.kind,fr:L.current.prompt,en:L.current.prompt};
  if(L.custom)return L.custom[L.idx];
  return Q.find(x=>x.id===L.plan[L.idx]);
}
const totalQ=(L)=>L.catalog?L.total:L.custom?L.custom.length:L.plan.length;
function snapshot(){const L=S.live;return {id:L.id,status:L.status,startedAt:L.startedAt,endedAt:L.endedAt,role:L.role,level:L.level,type:L.type,lang:L.lang,rubricVersion:L.rubricVersion,consentVersion:L.consentVersion,plan:L.plan,turns:L.turns,drill:!!L.drill,source:L.source||"builtin",evaluation:L.evaluation||null}}
let saveChain=Promise.resolve();
function persist(){
  const snap=snapshot(); const i=S.sessions.findIndex(s=>s.id===snap.id); if(i>=0)S.sessions[i]=snap; else S.sessions.push(snap);
  saveChain=saveChain.then(()=>call("PUT","/api/sessions/"+snap.id,snap)).catch(e=>toast("Sauvegarde impossible : "+e.message));
  return saveChain;
}
function interrupt(){if(!S.live)return;S.live.status="interrupted";persist();stopVoice()}

function interview(){
  const L=S.live; if(!L){go("home");return}
  if(L.awaitingNext)return renderNextRetry();
  const q=currentQ(L); const text=L.pending?L.pending.followup:q[L.lang];
  const M=S.prefs.media||{};
  app.innerHTML=`<section class="room">
    <div>${orbSVG("idle")}${S.cam?`<div class="cam" id="camBox"><video id="camVideo" muted playsinline></video><span>Aperçu local · non enregistré</span></div>`:""}</div>
    <div>
      <div class="meta"><span>Question ${L.idx+1} sur ${totalQ(L)} · ${esc(q.comp)}${L.catalog?` <span class="src-badge" title="Question issue du référentiel officiel S2-03, version figée">Référentiel S2-03</span>`:""}</span><span id="timer">0:00</span></div>
      <div class="progress" aria-hidden="true"><i style="width:${Math.round(L.idx/totalQ(L)*100)}%"></i></div>
      <p class="qtext ${L.pending?"followup":""}" id="qtext">${esc(text)}</p>
      ${L.pending?`<p class="hint" style="margin-top:8px">Relance de Lina sur la question : « ${esc(q[L.lang])} »</p>`:""}
      <label for="answer" class="hint" style="display:block;margin:26px 0 8px">Votre réponse</label>
      <textarea id="answer" placeholder="${L.lang==="en"?"Answer as you would out loud…":"Répondez comme vous le feriez à l’oral…"}"></textarea>
      <div class="answer-tools">
        <span class="live" id="liveInd"><i></i> <span id="wc">0 mot</span></span>
        <div class="row">${M.mic&&(sttServer()||SR)?`<button class="btn quiet" id="dictBtn" title="${sttServer()?"Transcription : Kyutai STT (modèle CC-BY 4.0)":"Dictée du navigateur"}">Dicter ma réponse</button>`:""}<button class="btn quiet" id="replay" ${S.voice&&synth?"":"hidden"}>Réécouter</button></div>
      </div>
      <div class="nav-row">
        <div class="row"><button class="btn quiet" id="pause">Pause</button><button class="btn quiet" id="end">Terminer</button></div>
        <div class="row"><button class="btn quiet" id="skip">${L.pending?"Passer la relance":"Passer"}</button><button class="btn primary" id="send" disabled>Envoyer</button></div>
      </div>
      ${L.turns.length?`<details class="transcript"><summary>Transcription (${L.turns.length} réponse${L.turns.length>1?"s":""})</summary><ol>${L.turns.map(t=>`<li><span class="who">Lina :</span> ${esc(t.prompt)}${t.followup?`<br><span class="who">Relance :</span> ${esc(t.followup)}`:""}<br><span class="who">Vous :</span> ${esc(t.answer||"(passée)")}</li>`).join("")}</ol></details>`:""}
    </div>
  </section>`;
  const ta=$("#answer"); ta.oninput=updateCount; ta.focus({preventScroll:true});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)&&!$("#send").disabled)submitAnswer()});
  if($("#dictBtn"))$("#dictBtn").onclick=toggleDictation;
  $("#replay").onclick=()=>speak(text,L.lang);
  $("#send").onclick=submitAnswer;
  $("#skip").onclick=()=>{if(L.pending){commitTurn(L.pending.answer,null,null)}else{L.turns.push({seq:L.turns.length+1,qid:q.id,comp:q.comp,kind:q.kind,prompt:q[L.lang],source:L.catalog?L.source:"builtin",answer:"",skipped:true,at:new Date().toISOString()});nextQuestion()}};
  $("#pause").onclick=pauseSession;
  $("#end").onclick=()=>{if(confirm("Terminer maintenant ? Les réponses données seront évaluées."))finish()};
  if(S.cam)startCam();
  startTimer(); setTimeout(()=>speak(text,L.lang),350);
}
let timerH; function startTimer(){clearInterval(timerH);const t0=Date.now();timerH=setInterval(()=>{const el=$("#timer");if(!el)return clearInterval(timerH);const s=Math.floor((Date.now()-t0)/1000);el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`},1000)}
function updateCount(){const n=words($("#answer").value);$("#wc").textContent=`${n} mot${n>1?"s":""}`;$("#send").disabled=n<3}
async function submitAnswer(){
  const L=S.live, ans=$("#answer").value.trim(); if(rec)rec.stop(); if(KYU.state!=="idle")kyuAbort();
  busy($("#send"),true);
  if(L.pending){commitTurn(L.pending.answer+" "+ans,L.pending.followup,ans);return}
  let f=null; const goalsPush=(S.prefs.profile.goals||[]).some(g=>["structure","examples"].includes(g));
  if(!L.followupAsked||goalsPush){
    if(API.ai){try{f=(await call("POST","/api/ai/followup",{question:currentQ(L)[L.lang],answer:ans,lang:L.lang,role:ROLES[L.role].fr})).followup||null}catch(e){f=localFollowup(ans,L.lang)}}
    else f=localFollowup(ans,L.lang);
  }
  if(f&&L.turns.filter(t=>t.followup).length<3){L.pending={answer:ans,followup:f};L.followupAsked=true;interview();return}
  commitTurn(ans,null,null);
}
function commitTurn(answer,followup,followupAnswer){
  const L=S.live,q=currentQ(L);
  L.turns.push({seq:L.turns.length+1,qid:q.id,comp:q.comp,kind:q.kind,prompt:q[L.lang],source:L.catalog?L.source:"builtin",answer:answer.trim(),followup,followupAnswer,at:new Date().toISOString()});
  L.pending=null; nextQuestion();
}
async function nextQuestion(){
  const L=S.live;
  if(!L.catalog){L.idx++;persist();if(L.idx>=totalQ(L))finish();else interview();return}
  // Référentiel S2-03 : le serveur choisit et fige la question suivante ; le navigateur ne connaît jamais la suite.
  L.awaitingNext=true; persist();
  try{
    const r=await call("POST","/api/interview/next",{sessionId:L.id});
    L.awaitingNext=false;
    if(r.done){finish();return}
    L.current=r.question; L.idx++; persist(); interview();
  }catch(e){L.netError=e.message;renderNextRetry()}
}
function renderNextRetry(){
  const L=S.live;
  app.innerHTML=`<section class="narrow empty">${orbSVG("idle",false)}<h2>Lina n’arrive pas à charger la question suivante</h2>
    <p class="lede" style="margin:14px auto 24px">${esc(L.netError||"Connexion interrompue.")} Vos ${L.turns.length} réponse${L.turns.length>1?"s sont enregistrées":" est enregistrée"}.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="retryNext">Réessayer</button><button class="btn quiet" id="endNow">Terminer avec ces réponses</button></div></section>`;
  $("#retryNext").onclick=()=>{busy($("#retryNext"),true,"Nouvel essai…");nextQuestion()};
  $("#endNow").onclick=()=>{L.awaitingNext=false;finish()};
}
function pauseSession(){
  const L=S.live; L.status="interrupted"; persist(); stopVoice();
  const ov=document.createElement("div"); ov.className="paused"; ov.innerHTML=`<div class="panel narrow" style="text-align:center"><h2>Entretien en pause</h2><p class="lede" style="margin:12px auto 24px">Vos réponses sont enregistrées. Reprenez quand vous êtes prêt·e.</p><button class="btn primary" id="resume">Reprendre</button></div>`;
  document.body.appendChild(ov); $("#resume").focus();
  $("#resume").onclick=()=>{ov.remove();L.status="in_progress";persist();interview()};
}
function finish(){const L=S.live;stopVoice();clearInterval(timerH);if(L.catalog)call("POST","/api/interview/finish",{sessionId:L.id}).catch(()=>{});L.status="processing";L.endedAt=new Date().toISOString();persist();go("processing")}
async function processing(){

  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.openReq=b.dataset.open;go("coachRequest")});
}
async function refreshRequests(){try{S.requests=(await call("GET","/api/requests")).requests}catch(e){toast(e.message)}}

        <div class="panel"><h3>Compte rendu et plan d’action</h3>
          ${r.notes.map(n=>`<div class="note"><b>${fmtDate(n.createdAt)}</b><p>${esc(n.content)}</p></div>`).join("")||`<p class="hint" style="margin-top:6px">Le candidat verra votre compte rendu dans son espace.</p>`}
          ${["accepted","done"].includes(r.status)?`<label class="field" style="margin-top:14px"><span class="sr-only">Nouveau compte rendu</span><textarea id="note" rows="6" style="min-height:150px" placeholder="Ce que nous avons travaillé, les points à retenir, les 2 ou 3 actions pour la prochaine simulation…"></textarea></label><p class="form-error" id="noteErr" role="alert" hidden></p><button class="btn primary wide" id="saveNote">Enregistrer le compte rendu</button>`:`<p class="hint" style="margin-top:10px">Acceptez la demande pour rédiger un compte rendu.</p>`}
        </div>
      </aside>
    </div>
  </section>`;
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{busy(b,true);try{await call("POST",`/api/requests/${r.id}/status`,{status:b.dataset.act});await refreshRequests();toast(b.dataset.act==="done"?"Séance marquée comme terminée":"Demande acceptée");coachRequest()}catch(e){toast(e.message);busy(b,false)}});
  const sn=$("#saveNote"); if(sn)sn.onclick=async()=>{const el=$("#noteErr");el.hidden=true;busy(sn,true,"Enregistrement…");try{await call("POST",`/api/requests/${r.id}/notes`,{content:$("#note").value});await refreshRequests();toast("Compte rendu enregistré");coachRequest()}catch(e){el.textContent=e.message;el.hidden=false;busy(sn,false)}};
}

/* =========================================================
   Avatar, voix, caméra
   ========================================================= */
function orbSVG(state="idle",name=true){
  return `<div class="orb ${state}" id="orb" aria-hidden="true"><svg viewBox="0 0 400 400">
    <circle class="ring" cx="200" cy="200" r="178" stroke-width="2" opacity=".35"/><circle class="ring" cx="200" cy="200" r="146" stroke-width="3" opacity=".5"/>
    <circle class="ring" cx="200" cy="200" r="114" stroke-width="5" opacity=".7"/><circle class="ring" cx="200" cy="200" r="84" stroke-width="8"/>
    <circle class="core" cx="200" cy="200" r="56"/><circle class="spark" cx="200" cy="200" r="16"/></svg>
    ${name?`<div class="name">Lina<small>votre recruteuse virtuelle</small></div>`:""}</div>`;
}
function setOrb(state){const o=$("#orb");if(o){o.classList.remove("idle","speaking","listening");o.classList.add(state)}}
const synth=window.speechSynthesis;
function speak(text,lang){
  if(!S.voice||!synth){setOrb("listening");return}
  synth.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=lang==="en"?"en-GB":"fr-FR"; u.rate=1.02;
  const v=synth.getVoices().find(v=>v.lang.startsWith(u.lang.slice(0,2))); if(v)u.voice=v;
  u.onstart=()=>setOrb("speaking"); u.onend=()=>setOrb("listening"); u.onerror=()=>setOrb("listening"); synth.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null;
function stopVoice(){try{synth&&synth.cancel()}catch(e){} if(rec){try{rec.stop()}catch(e){} rec=null} kyuAbort(); stopCam()}

/* ---------- Transcription Kyutai STT (via notre serveur) ---------- */
const sttServer=()=>API.mode==="remote"&&API.stt==="kyutai"&&!!window.WebSocket&&!!(window.AudioContext||window.webkitAudioContext);
const KYU={ws:null,ctx:null,stream:null,node:null,words:[],base:"",state:"idle"};
const PCM_WORKLET=`class P extends AudioWorkletProcessor{constructor(o){super();this.r=o.processorOptions.ratio;this.b=new Float32Array(1920);this.n=0;this.t=0}
process(inputs){const ch=inputs[0]&&inputs[0][0];if(!ch)return true;
 if(this.r===1){for(let i=0;i<ch.length;i++)this.push(ch[i])}
 else{while(this.t<ch.length-1){const i=Math.floor(this.t),f=this.t-i;this.push(ch[i]*(1-f)+ch[i+1]*f);this.t+=this.r}this.t-=ch.length}
 return true}
push(v){this.b[this.n++]=v;if(this.n===1920){this.port.postMessage(this.b.slice(0));this.n=0}}}
registerProcessor("pcm24k",P)`;
function kyuUi(label,on){const btn=$("#dictBtn"),live=$("#liveInd");if(btn){btn.textContent=label;btn.disabled=label.endsWith("…")}if(live){live.classList.toggle("on",!!on)}}
function kyuAbort(){const k=KYU;try{k.node&&k.node.disconnect()}catch(e){}try{k.ctx&&k.ctx.close()}catch(e){}try{k.stream&&k.stream.getTracks().forEach(t=>t.stop())}catch(e){}try{k.ws&&k.ws.readyState<2&&k.ws.close()}catch(e){}Object.assign(KYU,{ws:null,ctx:null,stream:null,node:null,state:"idle"})}
async function kyuStart(){
  const ta=$("#answer"); KYU.state="connecting"; kyuUi("Connexion…",false);
  try{KYU.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){kyuAbort();kyuUi("Dicter ma réponse",false);toast("Micro refusé par le navigateur. Vous pouvez répondre au clavier.");return}
  KYU.base=ta.value?ta.value.trim()+" ":""; KYU.words=[];
  const ws=new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/api/stt/stream`); ws.binaryType="arraybuffer"; KYU.ws=ws;
  let ready=false;
  ws.onmessage=async(e)=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(m.type==="ready"&&!ready){ready=true;try{await kyuAudio()}catch(err){toast("Capture audio impossible sur ce navigateur.");kyuAbort();kyuUi("Dicter ma réponse",false)}}
    else if(m.type==="word"){KYU.words.push(m.text);const t=$("#answer");if(t){t.value=KYU.base+KYU.words.join(" ").replace(/\s+([,.;:!?])/g,"$1");updateCount()}}
    else if(m.type==="vad"){const l=$("#liveInd span:last-child");if(l)l.textContent="Pause détectée"}
    else if(m.type==="error"){toast(m.message||"Transcription interrompue.")}
    else if(m.type==="done"){kyuAbort();kyuUi("Dicter ma réponse",false)}};
  ws.onclose=()=>{const wasReady=ready;kyuAbort();kyuUi("Dicter ma réponse",false);
    if(!wasReady&&SR){toast("Transcription Kyutai indisponible : dictée du navigateur.");browserDictation()}
    else if(!wasReady)toast("Service de transcription indisponible. Vous pouvez répondre au clavier.")};
}
async function kyuAudio(){
  const AC=window.AudioContext||window.webkitAudioContext; let ctx;
  try{ctx=new AC({sampleRate:24000})}catch(e){ctx=new AC()}
  KYU.ctx=ctx; const url=URL.createObjectURL(new Blob([PCM_WORKLET],{type:"text/javascript"}));
  await ctx.audioWorklet.addModule(url); URL.revokeObjectURL(url);
  const src=ctx.createMediaStreamSource(KYU.stream);
  const node=new AudioWorkletNode(ctx,"pcm24k",{processorOptions:{ratio:ctx.sampleRate/24000}}); KYU.node=node;
  node.port.onmessage=(e)=>{if(KYU.ws&&KYU.ws.readyState===1&&KYU.state==="live")KYU.ws.send(e.data.buffer)};
  const mute=ctx.createGain(); mute.gain.value=0; src.connect(node); node.connect(mute); mute.connect(ctx.destination);
  KYU.state="live"; kyuUi("Arrêter la dictée",true);
}
function kyuStop(){
  if(KYU.state!=="live")return kyuAbort();
  KYU.state="stopping"; kyuUi("Finalisation…",false);
  try{KYU.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{KYU.ws.send(JSON.stringify({type:"stop"}))}catch(e){}
  setTimeout(()=>{if(KYU.state==="stopping"){kyuAbort();kyuUi("Dicter ma réponse",false)}},6000);
}
function toggleDictation(){
  if(sttServer()){return KYU.state==="idle"?kyuStart():kyuStop()}
  browserDictation();
}
function browserDictation(){
  const btn=$("#dictBtn"), live=$("#liveInd"), ta=$("#answer"); if(rec){rec.stop();return}
  rec=new SR(); rec.lang=S.live.lang==="en"?"en-GB":"fr-FR"; rec.continuous=true; rec.interimResults=true;
  const base=ta.value?ta.value.trim()+" ":"";
  rec.onresult=(e)=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;ta.value=base+t;updateCount()};
  rec.onstart=()=>{btn.textContent="Arrêter la dictée";live.classList.add("on")};
  rec.onend=()=>{rec=null;btn.textContent="Dicter ma réponse";live.classList.remove("on")};
  rec.onerror=(e)=>toast(e.error==="not-allowed"?"Micro refusé par le navigateur. Vous pouvez répondre au clavier.":"Dictée interrompue. Réessayez ou répondez au clavier.");
  rec.start();
}
let camStream=null;
async function startCam(){try{camStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});const v=$("#camVideo");if(v){v.srcObject=camStream;v.play()}}catch(e){S.cam=false;toast("Caméra indisponible ou refusée. La simulation continue sans image.");const c=$("#camBox");if(c)c.remove()}}
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
